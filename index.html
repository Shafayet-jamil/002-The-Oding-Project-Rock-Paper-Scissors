<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <script src="javascript.js" defer></script>
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <div class="choice">
      <button id="humanChoice">Human Choice</button>
    </div>
    <div class="score">
      <p>Human: <span id="humanScore">0</span></p>
      <p>Computer: <span id="computerScore">0</span></p>
    </div>
    <div id="result"></div>
    <button id="resultButton">Result</button>
    <div></div>
  </body>
</html>
